name: Website

# The documentation site (docs/current) as a website on GitHub Pages: https://yonizilber.github.io/bus-merge-rl/
# It is built from what is committed only: the test counts and the test report are the snapshot in docs/current
# (refreshed by: python scripts/build_next_docs.py --root docs/current --github).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the documentation tools
        run: pip install "markdown>=3.5" "latex2mathml>=3.77" pygments
      - name: Build the website
        run: python scripts/build_next_docs.py --root docs/current --website _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
