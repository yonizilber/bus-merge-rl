[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "busmerge"
version = "0.1.0"
description = "Microscopic traffic simulation of a bus merging out of a bus bay, driven by a PPO agent, with a Streamlit dashboard."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yonatan Zilber" }]
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.50",
    "numpy>=1.23",
    "pandas>=1.5",
    "altair>=5.0",
    "matplotlib>=3.6",
    "Pillow>=9.0",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "hypothesis>=6", "markdown>=3.5"]

[tool.setuptools.packages.find]
include = ["busmerge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: long-running simulation tests",
    "nightly: brain-quality gates over many seeds; skipped unless pytest --nightly",
]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["scripts/diagnostics"]

[tool.ruff.lint]
# Start from correctness-only rules; style rules are tightened as modules are cleaned up.
select = ["E9", "F63", "F7", "F82", "F401", "F811"]
